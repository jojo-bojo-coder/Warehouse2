{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html {% if LANGUAGE_CODE == 'ar' %}dir="rtl"{% else %}dir="ltr"{% endif %}>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if LANGUAGE_CODE == 'ar' %}
      الرئيسية
      {% else %}
      Home
      {% endif %}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.22/css/dataTables.bootstrap4.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% block links %}
    {% endblock links %}

    <style>
      body {
        font-family: "Cairo", sans-serif;
      }

      /* Dark mode styles */
      .dark {
        background-color: #1a202c;
        color: #e2e8f0;
      }

      .dark .bg-white {
        background-color: #2d3748 !important;
      }

      .dark .text-gray-900 {
        color: #e2e8f0 !important;
      }

      .dark .text-gray-800 {
        color: #cbd5e0 !important;
      }

      .dark .text-gray-700 {
        color: #a0aec0 !important;
      }

      .dark .text-gray-600 {
        color: #718096 !important;
      }

      .dark .text-gray-500 {
        color: #4a5568 !important;
      }

      .dark .border-gray-200 {
        border-color: #4a5568 !important;
      }

      .dark .border-gray-300 {
        border-color: #4a5568 !important;
      }

      .dark .bg-gray-50 {
        background-color: #2d3748 !important;
      }

      .dark .bg-gray-100 {
        background-color: #4a5568 !important;
      }

      .dark .shadow-lg {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.15) !important;
      }

      .dark .shadow-md {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1) !important;
      }

      .dark .shadow-sm {
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.1) !important;
      }

      /* Form inputs in dark mode */
      .dark input,
      .dark select,
      .dark textarea {
        background-color: #4a5568 !important;
        border-color: #718096 !important;
        color: #e2e8f0 !important;
      }

      .dark input:focus,
      .dark select:focus,
      .dark textarea:focus {
        border-color: #63b3ed !important;
        box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.1) !important;
      }

      /* Buttons in dark mode */
      .dark .btn-primary {
        background-color: #3182ce !important;
        border-color: #3182ce !important;
      }

      .dark .btn-primary:hover {
        background-color: #2c5282 !important;
        border-color: #2c5282 !important;
      }

      /* Cards in dark mode */
      .dark .card {
        background-color: #2d3748 !important;
        border-color: #4a5568 !important;
      }

      /* Tables in dark mode */
      .dark table {
        background-color: #2d3748 !important;
      }

      .dark th {
        background-color: #4a5568 !important;
        color: #e2e8f0 !important;
      }

      .dark td {
        border-color: #4a5568 !important;
      }
    </style>
  </head>

  <body {% if LANGUAGE_CODE == 'ar' %}dir="rtl" lang="ar"{% else %}dir="ltr" lang="en"{% endif %} class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    {% include 'parts/coach_dashboard/navbar.html' %}

      {% block content %}
      {% endblock %}


    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.datatables.net/1.10.22/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.22/js/dataTables.bootstrap4.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
      // Configure Tailwind to enable dark mode
      tailwind.config = {
        darkMode: 'class',
      }
    </script>

    {% block scripts %}
    {% endblock %}
  </body>
</html>
