[phases.setup]
nixPkgs = ["python310", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build:css",
  "python manage.py collectstatic --noinput --clear"
]

[start]
cmd = "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT sportclub.asgi:application"